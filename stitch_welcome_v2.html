<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        navy: {
                            DEFAULT: '#0D1F3C',
                            dark: '#0F172A',
                        },
                        gold: {
                            DEFAULT: '#C9A84C',
                        }
                    },
                    fontFamily: {
                        headline: ["Oswald", "sans-serif"],
                        display: ["Public Sans", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Public Sans", "sans-serif"]
                    },
                    animation: {
                        'float-up': 'floatUp 0.8s ease-out forwards',
                        'diagonal-slide': 'diagonalSlide 1.2s ease-out forwards',
                        'glow': 'glowPulse 3s infinite',
                    },
                    keyframes: {
                        floatUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        diagonalSlide: {
                            '0%': { transform: 'translateX(-10%) skewY(-6deg)', opacity: '0' },
                            '100%': { transform: 'translateX(0) skewY(-6deg)', opacity: '1' },
                        },
                        glowPulse: {
                            '0%, 100%': { opacity: '0.4' },
                            '50%': { opacity: '0.8' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .diagonal-cut {
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
        }
        .diagonal-bg {
            transform: skewY(-6deg);
            transform-origin: top left;
        }
        .inner-glow-gold {
            box-shadow: inset 0 0 12px rgba(201, 168, 76, 0.4), 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .glass-card-accent::before {
            content: '✦';
            position: absolute;
            top: 12px;
            right: 12px;
            color: #C9A84C;
            font-size: 14px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>

<div class="flex-1 h-[120%] -translate-y-20 bg-cover bg-center rounded-b-full" data-alt="Close-up of a modern, sleek mechanical keyboard in a dimly lit student workspace. The lighting is moody and focused, with deep blue shadows and crisp white highlights on the keycaps. The visual style is minimalist and high-tech, reflecting a secure and instant document fulfillment ecosystem." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDuB1VRR1glp8RF5RecqR5MfmPRqSJ_-1kfNI30meuFgqUZM1VwN1LPrHVHd2Fjdxejf63cNTNBSQDkrMGbZgYV1jSA5EcVqdzlgLCaHGVKWor9Fy8pT7eXnZmNOKkEHRXPpXoX-4_E9JKOuE089fnya6ylEGU_DAzolrMkqa-9ntBPowSJVQS54JbcXLhtlEop4iVnvDBmkxiuICPrOyyFyRab1cr6IC2UPcKoEb93VUAMweTzoiG0Bt770gtG43I9w3K9CD8Lc_I')">

<div class="flex-1 h-[120%] -translate-y-5 bg-cover bg-center rounded-b-full" data-alt="A diverse group of university students engaged in collaborative study within a bright, modern campus corridor. The image features a clean, high-contrast aesthetic with sharp edges and premium textures, emphasizing an authoritative yet accessible institutional atmosphere." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDJ0CiwJ6WRhtC-TzQlKGizqlLICAiiYnaSD1SGgre98A6HtKQEPkxzAqaYS1tB966y5NedaIKvRC1xDHmaaaxL-WudN8Ym-ddttJFoJ0j1G1u8hM8iL8F-LKmKqHa_Vp1PHBDYb9BZpRwk9oMNOCPwWJxLoRzdTRymvHa4CM8u2X9lZOoat561aGassFbAMb2tqlhqXP1KgrzpNxrv2OCH6H8n0n4OMviTD_k0u7Y2Ory7P30DRLb-63FCq0lbaDaKyq955qonZMI')">

<!-- Top Navigation -->
<nav class="relative z-20 flex justify-between items-center px-6 py-8">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-gold rounded-lg flex items-center justify-center inner-glow-gold">
<span class="material-symbols-outlined text-navy text-2xl" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
<span class="text-white font-headline font-bold text-xl tracking-widest uppercase">Presidency University</span>
</div>
<button class="text-white hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl">menu</span>
</button>
</nav>
<!-- Hero Content -->
<div class="relative z-20 px-8 pt-12 max-w-lg">
<p class="text-white/60 text-xs font-bold tracking-[0.3em] uppercase mb-4 animate-float-up">
                Official Printing Network
            </p>
<h1 class="text-white font-headline font-bold text-5xl leading-tight mb-6 animate-float-up" style="animation-delay: 0.1s">
                Print across the <span class="text-gold">entire campus.</span>
</h1>
<p class="text-white/80 text-lg leading-relaxed font-light animate-float-up" style="animation-delay: 0.2s">
                Seamless, secure, and instant document fulfillment for the Presidency community.
            </p>
</div>
<!-- Decorative Star -->
<div class="absolute bottom-24 right-12 animate-glow">
<span class="text-gold text-4xl">✦</span>
</div>
</section>
<!-- Bottom Section (White) -->
<section class="relative flex-1 bg-white flex flex-col justify-end pb-12 px-6">
<!-- Floating Element: Kiosk Controls -->
<div class="glass-card-accent relative bg-navy-dark rounded-2xl p-6 shadow-2xl flex flex-col gap-4 -translate-y-20 border border-white/10 animate-float-up" style="animation-delay: 0.4s">
<!-- Session Placeholder -->
<div class="flex items-center gap-4 mb-2 bg-white/5 p-3 rounded-lg border border-white/10">
<div class="w-10 h-10 rounded-full bg-gold/20 flex items-center justify-center">
<span class="material-symbols-outlined text-gold">person</span>
</div>
<div>
<p class="text-white font-bold text-sm">Guest Session</p>
<p class="text-white/50 text-[10px] uppercase tracking-wider">Tap to start secure printing</p>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Sign In Button -->
<button class="group relative flex items-center justify-center gap-2 py-4 px-4 bg-navy rounded-xl border border-white/20 text-white font-medium hover:bg-navy-dark transition-all duration-300" onclick="this.classList.add('scale-95')">
<span class="material-symbols-outlined text-xl group-hover:-translate-x-1 transition-transform">login</span>
                    Sign In
                </button>
<!-- Scan QR Button -->
<button class="group relative flex items-center justify-center gap-2 py-4 px-4 bg-white rounded-xl text-navy font-bold shadow-lg hover:shadow-gold/20 transition-all duration-300 overflow-hidden" onclick="this.classList.add('scale-95')">
<div class="absolute inset-0 bg-gold/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-xl group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
                    Scan QR
                </button>
</div>
</div>
<!-- Quick Info / Status -->
<div class="flex justify-between items-center px-2">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
<span class="text-navy/60 text-xs font-semibold uppercase tracking-tighter">Terminal ID: PRNT-09-LB</span>
</div>
<div class="flex items-center gap-4 text-navy/40">
<span class="material-symbols-outlined text-xl">help_outline</span>
<span class="material-symbols-outlined text-xl">language</span>
</div>
</div>
</section>
<!-- Page Interaction Feedback Overlay (JS Hook) -->
<div class="fixed pointer-events-none w-12 h-12 border-2 border-gold rounded-full opacity-0 scale-0 transition-all duration-500 z-50" id="click-feedback"></div>
<script>
        // Micro-interactions
        document.addEventListener('click', (e) => {
            const feedback = document.getElementById('click-feedback');
            feedback.style.left = `${e.clientX - 24}px`;
            feedback.style.top = `${e.clientY - 24}px`;
            feedback.classList.remove('opacity-0', 'scale-0');
            feedback.classList.add('opacity-100', 'scale-150');
            
            setTimeout(() => {
                feedback.classList.add('opacity-0');
                feedback.classList.remove('scale-150');
                setTimeout(() => feedback.classList.add('scale-0'), 500);
            }, 300);
        });

        // Add 3D "Page Turn" feel to the primary card on hover (desktop/mouse only)
        const card = document.querySelector('.glass-card-accent');
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return;
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            card.style.transform = `translateY(-5rem) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = `translateY(-5rem) rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body></html>
